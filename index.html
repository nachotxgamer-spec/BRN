<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Cobranzas y Préstamos</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #00e676;
      --text: #ffffff;
      --text-dim: #b0b0b0;
      --border: #333333;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 800px; margin: 0 auto; }

    h1, h2 { text-align: center; margin-bottom: 20px; color: var(--accent); }
    
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #2a2a2a;
      color: var(--text);
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { opacity: 0.9; }

    .client-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      border-left: 5px solid var(--accent);
    }

    .client-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .client-name { font-size: 1.2rem; font-weight: bold; }
    .client-stats { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; }
    
    .btn-pay {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      width: auto;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .btn-pay:hover { background: var(--accent); color: #000; }
  </style>
</head>
<body>

  <h1>Control de Cobranzas</h1>

  <!-- FORMULARIO NUEVO PRESTAMO -->
  <div class="card">
    <h2>Nuevo Perfil / Préstamo</h2>
    <form id="loanForm">
      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="clientName" placeholder="Ej: Juan Pérez" required>
      </div>
      <div class="form-group">
        <label>Monto Prestado ($)</label>
        <input type="number" id="amount" placeholder="100000" required>
      </div>
      <div class="form-group">
        <label>Porcentaje Interés (%)</label>
        <input type="number" id="interest" placeholder="20" required>
      </div>
      <div class="form-group">
        <label>Cantidad de Cuotas</label>
        <input type="number" id="installments" placeholder="4" required>
      </div>
      <div class="form-group">
        <label>Frecuencia de Pago</label>
        <select id="frequency">
          <option value="Semanal">Semanal</option>
          <option value="Quincenal">Quincenal</option>
          <option value="Mensual">Mensual</option>
        </select>
      </div>
      <button type="submit">Guardar Préstamo</button>
    </form>
  </div>

  <!-- LISTA DE PERFILES Y COBROS -->
  <h2>Perfiles Activos</h2>
  <div id="clientList">Cargando perfiles...</div>

  <!-- FIREBASE LOGIC -->
  <script type="module" src="app.js"></script>
</body>
</html>
